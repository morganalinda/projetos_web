<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Restaurante</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="../js/script_calculo.js" defer></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="shortcut icon" href="https://img.icons8.com/?size=100&id=G5vSJ5ILgMXQ&format=png&color=000000">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #fce4ec; /* Rosa Bebê Suave */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #121212; /* Preto */
            width: 100%;
            max-width: 360px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            border: 2px solid #f48fb1;
        }

        h1 {
            color: #f48fb1; /* Rosa Bebê */
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .subtitulo {
            color: #b0bec5;
            text-align: center;
            font-size: 12px;
            margin-bottom: 22px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            color: #fce4ec;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
        }

        input {
            padding: 10px 14px;
            margin-bottom: 14px;
            border: 1.5px solid #333333;
            border-radius: 10px;
            background-color: #1e1e1e;
            color: #ffffff;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #f48fb1;
            box-shadow: 0 0 8px rgba(244, 143, 177, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button[type="submit"] {
            background-color: #f48fb1;
            color: #121212;
        }

        button[type="submit"]:hover {
            background-color: #ff80ab;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 128, 171, 0.3);
        }

        .limpar {
            background-color: #2a2a2a;
            color: #fce4ec;
            border: 1px solid #333333;
        }

        .limpar:hover {
            background-color: #383838;
            color: #ffffff;
        }

        .resultado {
            background-color: #1e1e1e;
            padding: 16px;
            margin-top: 20px;
            border-radius: 12px;
            border-left: 4px solid #f48fb1;
        }

        .resultado h3 {
            color: #f48fb1;
            margin-bottom: 10px;
            text-align: center;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .resultado p {
            color: #e0e0e0;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .resultado p:last-child {
            margin-bottom: 0;
            font-weight: 600;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Calculadora de Restaurante</h1>

        <p class="subtitulo">Divida a conta e a taxa de serviço com facilidade!</p>

        <form onsubmit="calc_restaurante(event)">

            <label for="valor">Valor da conta (R$):</label>
            <input type="number" id="valor" step="0.01" placeholder="0.00" required>

            <label for="pessoas">Número de pessoas:</label>
            <input type="number" id="pessoas" step="1" min="1" placeholder="Ex: 2" required>

            <div class="btn-group">
                <button type="submit">Calcular</button>
                <button type="reset" class="limpar">Limpar</button>
            </div>

        </form>

        <div class="resultado">
            <h3>Resultado</h3>
            <p id="resultado1">Valor original: R$ 0.00</p>
            <p id="resultado2">10% Garçom: R$ 0.00</p>
            <p id="resultado3">Total com taxa: R$ 0.00</p>
            <p id="resultado4">Valor por pessoa: R$ 0.00</p>
        </div>

    </div>

    <script>
        function calc_restaurante(event) {
            event.preventDefault();

            let valor = Number(document.getElementById("valor").value);
            let pessoas = Number(document.getElementById("pessoas").value);

            let percentual = valor * 0.10;
            let valor_atual = valor + percentual;
            let conta = valor_atual / pessoas;

            document.getElementById("resultado1").innerHTML = '<b>Valor original:</b> R$ ' + valor.toFixed(2);
            document.getElementById("resultado2").textContent = '10% Garçom: R$ ' + percentual.toFixed(2);
            document.getElementById("resultado3").textContent = 'Total com taxa: R$ ' + valor_atual.toFixed(2);
            document.getElementById("resultado4").textContent = 'Valor por pessoa: R$ ' + conta.toFixed(2);
        }
    </script>

</body>

</html>
