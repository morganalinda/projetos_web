<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio de Lau</title>
    <style>
        /* --- RESET E VARIÁVEIS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #0d0d0d;
            --card-bg: #181818;
            --pink-baby: #ffd1dc;
            --pink-accent: #f8c8dc;
            --pink-glow: rgba(255, 209, 220, 0.25);
            --text-color: #f5f5f5;
            --text-muted: #b3b3b3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* --- CABEÇALHO --- */
        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--pink-baby);
            text-transform: lowercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--pink-glow);
        }

        /* --- GRID DOS PROJETOS --- */
        main {
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
            justify-content: center;
        }

        /* --- CARDS AESTHETIC --- */
        main > div {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 209, 220, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        main > div:hover {
            transform: translateY(-6px);
            border-color: var(--pink-baby);
            box-shadow: 0 12px 25px var(--pink-glow);
        }

        main h3 {
            font-size: 1.1rem;
            color: var(--pink-baby);
            margin-bottom: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* --- IMAGENS E LINKS --- */
        main a {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
        }

        main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        main div:hover img {
            transform: scale(1.05);
        }

        /* --- RODAPÉ --- */
        footer {
            margin-top: auto;
            padding-top: 3rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Portifólio de Lau</h1>
    </header>
    
    <main>
        <div>
            <h3>Calculadora de desconto !</h3>
            <a href="./Desconto_calc.html">
                <img src="https://www.impolut.com.br/wp-content/uploads/2022/07/CALCULADORA-TC04-ROSA-II.jpg" alt="Calculadora de Desconto">
            </a>
        </div>

        <div>
            <h3>Calculadora de conta do restaurante !</h3>
            <a href="./calc_restaurante.html">
                <img src="https://www.impolut.com.br/wp-content/uploads/2022/07/CALCULADORA-TC04-ROSA-II.jpg" alt="Calculadora de Conta de Restaurante">
            </a>
        </div>
        <div>
            <h3>Site de turismo da Russia !</h3>
            <a href="./turismo.html">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6ZjwpoPyc7xrnfz6v28uV-Wed1LycLrp0P9cMD7enXReWsskv9Y-0cg&s=10" alt="turismo_russia">
            </a>



        </div>
    </main>

    <footer>
        <p>Todos os direitos reservados!! &copy; 2026</p>
    </footer>
</body>
</html>
